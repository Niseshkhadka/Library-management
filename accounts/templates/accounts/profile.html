{% extends "accounts/base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
    <h2>My Profile</h2>
    <p class="subtitle">Role: {{ user.role }}</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
    <p class="footer-link"><a href="{% url 'dashboard-page' %}">Back to dashboard</a></p>
    <p class="footer-link"><a href="{% url 'logout-page' %}">Log out</a></p>
{% endblock %}
