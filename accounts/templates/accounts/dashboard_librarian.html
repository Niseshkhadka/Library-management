{% extends "accounts/base.html" %}

{% block title %}Librarian Dashboard{% endblock %}

{% block content %}
    <h2>Welcome, {{ user.username }}</h2>
    <p class="subtitle">Librarian Dashboard</p>

    <p style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; color: #6B5D4D; margin-bottom: 24px;">
        Manage the book catalog, track borrowed books, and assist members.
    </p>

    <a href="{% url 'profile-page' %}"><button>My Profile</button></a>
    <a href="{% url 'book-list-page' %}"><button>Browse Books</button></a>

    <p class="footer-link"><a href="{% url 'logout-page' %}">Log out</a></p>
{% endblock %}
